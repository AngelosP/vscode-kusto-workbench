# CI/CD build + (optional) publish workflow
#
# - Runs on pushes to main and on version tags (v*)
# - Uses Nerdbank.GitVersioning (NBgv) to compute a SemVer and stamp it into package.json
# - Builds and packages a .vsix
# - Publishes to VS Code Marketplace and creates a GitHub Release only on:
#     - tag push refs/tags/v*
#     - or manual workflow_dispatch with publish=true

name: build

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - '**/*.gitignore'
      - '**/*.gitattributes'
      - '.github/**'
      - 'resources/**'
      - 'docs/**'
      - 'sample/**'
      - 'browser-ext/**'
      - 'web/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Marketplace + create GitHub Release'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    needs: connector-runtime-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history required by NBgv)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Setup .NET (for NBgv tool)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install NBgv tool (into runner temp)
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/nbgv" nbgv
          echo "$RUNNER_TEMP/nbgv" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      - name: Compute version (NBgv)
        id: nbgv
        shell: bash
        run: |
          set -euo pipefail
          nbgv cloud

          VERSION_JSON=$(nbgv get-version -f json)
          echo "$VERSION_JSON" | head -c 2000

          VERSION=$(VERSION_JSON="$VERSION_JSON" node -e "const v=JSON.parse(process.env.VERSION_JSON); process.stdout.write(String(v.SemVer2 || v.SemVer || v.Version));")
          echo "Computed version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Stamp package.json version
        shell: bash
        run: |
          set -euo pipefail
          echo "Stamping package.json => ${{ steps.nbgv.outputs.version }}"
          npm version "${{ steps.nbgv.outputs.version }}" --no-git-tag-version

      - name: Lint
        run: npm run lint

      - name: Build (package)
        run: npm run package

      - name: Run external MCP tests
        run: npx vitest run tests/webview/host/externalMcpCatalog.test.ts tests/webview/host/externalMcpHostEligibility.test.ts tests/webview/host/externalMcpProviderStartup.test.ts tests/webview/host/externalMcpProviderStateCoordinator.test.ts tests/webview/host/externalMcpProviderLifecycle.test.ts tests/webview/host/externalMcpConnectorCore.test.ts tests/webview/host/externalMcpConnectorStdio.test.ts tests/webview/host/externalMcpRuntime.test.ts tests/webview/host/externalMcpConnectorInstaller.test.ts tests/webview/host/externalMcpDiscovery.test.ts tests/webview/host/externalMcpClientProvisioning.test.ts tests/webview/host/externalMcpSetup.test.ts tests/webview/host/workbenchMcpBridge.test.ts tests/webview/host/workbenchMcpToolAdapter.test.ts tests/webview/host/toolOrchestratorConnect.test.ts tests/webview/host/firstLaunchIntegration.test.ts tests/webview/host/skill-template.test.ts tests/webview/host/tutorialCatalog.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Validate tutorial catalog
        run: npm run validate:tutorials

      - name: Install Xvfb (for VS Code tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run tests
        timeout-minutes: 15
        run: xvfb-run -a npm test -- --bail

      - name: Package VSIX (vsce)
        id: package-vsix
        shell: bash
        run: |
          set -euo pipefail
          VSIX_PATH="out/releases/vscode-kusto-workbench-${{ steps.nbgv.outputs.version }}.vsix"
          node scripts/package-vsix.mjs
          test -f "$VSIX_PATH"
          echo "path=$VSIX_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ steps.nbgv.outputs.version }}
          path: ${{ steps.package-vsix.outputs.path }}

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "VSCE_PAT is not set. Add it as a repository secret to publish."
            exit 1
          fi
          node node_modules/@vscode/vsce/vsce publish --packagePath "${{ steps.package-vsix.outputs.path }}" --pat "$VSCE_PAT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        uses: softprops/action-gh-release@v0.1.15
        with:
          tag_name: v${{ steps.nbgv.outputs.version }}
          name: v${{ steps.nbgv.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.package-vsix.outputs.path }}

  connector-runtime-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build connector artifacts
        run: |
          node esbuild.js
          node scripts/stage-mcp-connector-runtime.mjs
          node scripts/package-external-mcp-bootstrap.mjs

      - name: Verify packaged Windows connector
        run: |
          npx vitest run tests/webview/host/externalMcpRuntime.test.ts tests/webview/host/externalMcpConnectorInstaller.test.ts tests/webview/host/externalMcpDiscovery.test.ts tests/webview/host/externalMcpSetup.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Compile extension-host tests
        run: npm run compile-tests

      - name: Verify external MCP provider in VS Code
        run: npx vscode-test --config .vscode-test.mjs --timeout 60000 --fail-zero --grep "External MCP provider"

      - name: Verify packaged cold launch and report lifecycle
        timeout-minutes: 10
        env:
          KUSTO_WORKBENCH_RUN_COLD_MCP_E2E: '1'
        run: npx vitest run tests/webview/host/externalMcpColdLaunch.e2e.test.ts --maxWorkers=1 --no-file-parallelism
