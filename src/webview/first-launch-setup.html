<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="{{csp}}">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Set up Kusto Workbench</title>
	<style nonce="{{nonce}}">html, body { width: 100%; height: 100%; min-height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--vscode-editor-background); } #first-launch-scroll { box-sizing: border-box; width: 100%; height: 100vh; overflow: auto; } kw-first-launch-setup { display: block; width: 100%; min-height: 100vh; } @font-face { font-family: "codicon"; font-display: block; src: url("{{codiconFontUri}}") format("truetype"); }</style>
</head>
<body>
	<div id="first-launch-scroll">
		<kw-first-launch-setup logo-uri="{{kustoWorkbenchLogoUri}}"></kw-first-launch-setup>
	</div>
	<script nonce="{{nonce}}" src="{{firstLaunchSetupBundleUri}}"></script>
</body>
</html>
